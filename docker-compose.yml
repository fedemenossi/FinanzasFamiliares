services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: family_finance
      MYSQL_USER: family
      MYSQL_PASSWORD: family
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://family:family@mysql:3306/family_finance
      SECRET_KEY: change-me-local
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads:
